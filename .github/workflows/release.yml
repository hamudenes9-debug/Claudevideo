name: Package v1.0.1 release
on:
  push:
    branches: [arena/5db6424e-claudevideo]
    paths: [.github/workflows/release.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r skills/brand-video/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python skills/brand-video/scripts/render.py render skills/brand-video/examples/brand-demo.json --out output/demo
      - run: python scripts/package.py
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.1 --target "${{ github.sha }}" --title "Brand Video v1.0.1 — Skill kurulum düzeltmesi" --notes-file RELEASE_NOTES.md
          gh release upload v1.0.1 dist/brand-video-v1.0.1.zip dist/brand-video-demo-v1.0.1.zip dist/SHA256SUMS.txt --clobber
