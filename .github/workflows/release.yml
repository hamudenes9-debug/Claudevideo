name: Package v1.0.0 release
on:
  push:
    branches: [arena/5db6424e-claudevideo]
    paths: [.github/workflows/release.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r skills/claude-video/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python skills/claude-video/scripts/render.py render skills/claude-video/examples/brand-demo.json --out output/demo
      - run: python scripts/package.py
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.0 dist/claude-video-v1.0.0.zip dist/claude-video-demo-v1.0.0.zip dist/SHA256SUMS.txt --clobber
